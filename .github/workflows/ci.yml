name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages
        # ffmpeg and libopus are runtime deps (see Dockerfile); without them
        # the audio and Fish decode tests are skipped.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libopus0

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        # The type check resolves imports, so it needs the runtime deps too.
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check --output-format=github .

      - name: Type check
        # Fails only on errors missing from .basedpyright/baseline.json.
        run: basedpyright
