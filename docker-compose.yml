services:
  tts_bot:
    build: .
    image: custom-tts-bot:latest
    container_name: discord_tts_bot
    env_file:
      - path: .env
        required: false
    network_mode: "container:gluetun"
    restart: unless-stopped
    volumes:
      - ./bot.py:/app/bot.py
      - ./tts_providers.py:/app/tts_providers.py
      - ./voice_registry.py:/app/voice_registry.py
      - ./models:/app/models:ro
      - ./data:/app/data
