services:
  tts_bot:
    build: .
    # Prebuilt image published by .github/workflows/docker.yml;
    # `docker compose pull` fetches it, `docker compose up -d --build`
    # rebuilds locally instead.
    image: ghcr.io/OWNER/discord-tts-bot:latest
    container_name: discord_tts_bot
    env_file:
      - path: .env
        required: false
    network_mode: "container:gluetun"
    restart: unless-stopped
    volumes:
      - ./bot.py:/app/bot.py
      - ./ttsbot:/app/ttsbot
      - ./tts_providers.py:/app/tts_providers.py
      - ./voice_registry.py:/app/voice_registry.py
      - ./models:/app/models:ro
      - ./data:/app/data
