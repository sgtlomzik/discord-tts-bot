services:
  tts_bot:
    build: .
    # Prebuilt image published by .github/workflows/docker.yml;
    # `docker compose pull` fetches it, `docker compose up -d --build`
    # rebuilds locally instead.
    image: ghcr.io/sgtlomzik/discord-tts-bot:latest
    container_name: discord_tts_bot
    env_file:
      - path: .env
        required: false
    # Host-specific tweaks (VPN network_mode, extra mounts, ...) belong in
    # an untracked docker-compose.override.yml — compose merges it in
    # automatically.
    restart: unless-stopped
    # Code ships inside the image; only data and models are mounted.
    # (For hot-reload development, bind-mount ./bot.py and ./ttsbot in
    # your docker-compose.override.yml.)
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data
