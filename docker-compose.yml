services:
  tts_bot:
    build: .
    image: custom-tts-bot:latest
    container_name: discord_tts_bot
    env_file:
      - path: .env
        required: false
    network_mode: "container:gluetun"
    restart: unless-stopped
    volumes:
      - ./bot.py:/app/bot.py
      - ./models:/app/models:ro
      - ./data:/app/data

  supertonic:
    image: python:3.11-slim
    container_name: supertonic_tts
    network_mode: "container:gluetun"
    command: >
      sh -c "pip install 'supertonic[serve]' &&
             supertonic serve --host 127.0.0.1 --port 7788"
    restart: unless-stopped
    volumes:
      - supertonic-cache:/root/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7788/docs', timeout=3).read(100)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s

volumes:
  supertonic-cache:
